apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  labels:
    app: fastapi
type: Opaque
stringData:
  # DEMO CREDENTIALS, COMMITTED IN PLAINTEXT ON PURPOSE.
  #
  # Separate from the timescaledb Secret rather than added to it, because that
  # one is mounted into the database StatefulSet as well — and the database pod
  # has no business holding the API's signing key. Splitting them also means
  # rotating the key does not restart Postgres.
  #
  # Override before running anywhere that is not a trusted machine:
  #
  #   kubectl create secret generic api-secrets \
  #     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
  #     --from-literal=ADMIN_PASSWORD="$(openssl rand -base64 24)" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  #   kubectl rollout restart deploy/fastapi
  #
  # Two things worth knowing before rotating:
  #
  # * A plain Secret does not trigger a rollout when it changes (a kustomize
  #   secretGenerator would, by hashing the name). Hence the explicit restart.
  # * Changing JWT_SECRET invalidates every token already issued, so every user
  #   is logged out. That is the intended behaviour, not a bug — but it should
  #   not be a surprise.
  # * Changing ADMIN_PASSWORD alone does nothing: the account already exists and
  #   is not reconciled. Set ADMIN_PASSWORD_RESET=true in app-config for one
  #   restart to force it, then set it back to "false".

  # Signs and verifies JWTs. Must be identical across replicas, or a token
  # minted by one pod is rejected by the next.
  JWT_SECRET: dev-only-not-a-secret-0123456789abcdef0123456789abcdef

  # Used once, to create the admin account on the first boot against an empty
  # database. See ADMIN_USERNAME in app-config.yaml.
  ADMIN_PASSWORD: dev-only-admin-password
