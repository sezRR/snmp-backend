# Values for the official Traefik Helm chart (tested against chart 41.0.2,
# Traefik v3.7). Installed with:
#
#   helm repo add traefik https://traefik.github.io/charts
#   helm upgrade --install traefik traefik/traefik \
#     --namespace traefik --create-namespace \
#     -f k8s/traefik-values.yaml

deployment:
  replicas: 1

# OrbStack publishes LoadBalancer Services onto the Mac, so Traefik ends up on
# host port 80. Only one Service can hold that port — which is why the app's own
# Service is ClusterIP now.
service:
  type: LoadBalancer

ports:
  web:
    expose:
      default: true
    exposedPort: 80
  websecure:
    # Do not claim host port 443; no certificates are configured.
    expose:
      default: false
  # Extra TCP entryPoint for the IngressRouteTCP in front of TimescaleDB.
  # ⚠️ This puts the database on the Mac's port 5432 — see the README warning.
  postgres:
    port: 5432
    exposedPort: 5432
    protocol: TCP
    expose:
      default: true

providers:
  # Routing is expressed as Traefik IngressRoute/Middleware CRDs, so the
  # Ingress watcher has nothing to do.
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true

# No Ingress objects, so no IngressClass to claim.
ingressClass:
  enabled: false

log:
  level: INFO

accessLog:
  enabled: true
