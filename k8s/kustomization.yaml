apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Database first: the app applies its schema on startup.
  - timescaledb-pvc.yaml
  - timescaledb-secret.yaml
  - timescaledb-statefulset.yaml
  - timescaledb-service.yaml
  # Application.
  - app-config.yaml
  - deployment.yaml
  - service.yaml
  # Traefik routing (needs the CRDs from the Helm chart).
  - middleware.yaml
  - ingressroute.yaml
  - ingressroutetcp.yaml
