apiVersion: v1
kind: Secret
metadata:
  name: timescaledb
  labels:
    app: timescaledb
type: Opaque
stringData:
  # DEMO CREDENTIALS, COMMITTED IN PLAINTEXT ON PURPOSE.
  #
  # The IngressRouteTCP publishes this database on the Mac's port 5432, and
  # OrbStack binds published ports on every interface — so on a shared network
  # this password is the only thing between the LAN and the data. Override it
  # before running anywhere that is not a trusted machine:
  #
  #   kubectl create secret generic timescaledb \
  #     --from-literal=POSTGRES_DB=app \
  #     --from-literal=POSTGRES_USER=app \
  #     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
  #     --from-literal=PGHOST=timescaledb --from-literal=PGPORT=5432 \
  #     --from-literal=PGDATABASE=app --from-literal=PGUSER=app \
  #     --from-literal=PGPASSWORD="<same value>" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  #   kubectl rollout restart statefulset/timescaledb deploy/fastapi
  #
  # (An existing data directory keeps the password it was initialised with;
  # `ALTER ROLE app PASSWORD ...` or a fresh PVC is needed to actually rotate.)

  # Consumed by the database container.
  POSTGRES_DB: app
  POSTGRES_USER: app
  POSTGRES_PASSWORD: dev-only-not-a-secret

  # Consumed by the application via envFrom — the libpq variable names the
  # TigerData Kubernetes guide uses, which are also what Settings reads.
  PGHOST: timescaledb
  PGPORT: "5432"
  PGDATABASE: app
  PGUSER: app
  PGPASSWORD: dev-only-not-a-secret
