apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: fastapi
data:
  # Non-secret half of Settings (src/app/config.py). Database credentials come
  # from the timescaledb Secret and the API's own from api-secrets; all three
  # are mounted with envFrom, and real environment variables take precedence
  # over any .env file in the image.

  # Must match the IngressRoute path and its StripPrefix middleware.
  ROOT_PATH: /api
  LOG_LEVEL: INFO

  # SQLAlchemy's pool_size is the persistent pool; anything past it is opened
  # and closed per checkout, so this is a floor worth having above 1.
  DB_POOL_MIN: "5"
  # Sized for request handlers plus the two or three queries a tick issues.
  # Unrelated to COLLECTOR_CONCURRENCY, which bounds SNMP calls, not queries.
  DB_POOL_MAX: "16"
  # `alembic upgrade head` on startup, under an advisory lock so replicas do not
  # race. Set to "false" to migrate from a Job instead.
  DB_AUTO_MIGRATE: "true"

  COLLECTOR_ENABLED: "true"
  COLLECTOR_INTERVAL_SECONDS: "5"
  COLLECTOR_CONCURRENCY: "32"
  # 0 derives the per-machine ceiling from the interval.
  COLLECTOR_SAMPLE_TIMEOUT_SECONDS: "0"

  # No real SNMP agents on this cluster; the simulator produces the same
  # payload shape. Set to false to poll the machines' real IPv4 addresses.
  SNMP_SIMULATE: "false"
  SNMP_COMMUNITY: public
  SNMP_PORT: "161"
  SNMP_TIMEOUT_SECONDS: "1.5"
  SNMP_RETRIES: "1"
  # Rows per GETBULK response. Held low because the agents are polled over a
  # Tailscale tunnel (1280-byte MTU) from inside the cluster: a bigger reply is
  # fragmented and the fragments do not survive the hop out of the VM.
  SNMP_MAX_REPETITIONS: "10"
  SNMP_DISKIO_ENABLED: "true"

  # Compression and retention on the metrics hypertable. At a five second
  # interval an unbounded history is measured in gigabytes per day.
  METRICS_COMPRESS_AFTER_HOURS: "24"
  METRICS_RETENTION_DAYS: "30"

  # Read-only Nova/Keystone/Neutron inventory. Fill the cloud-specific values
  # here and OS_PASSWORD in api-secrets before deploying with simulation off.
  OPENSTACK_SIMULATE: "false"
  OPENSTACK_CACHE_TTL_SECONDS: "300"
  OPENSTACK_API_TIMEOUT_SECONDS: "10"
  OS_AUTH_URL: ""
  # Either OS_USER_ID (a UUID) or OS_USERNAME plus OS_USER_DOMAIN_ID. A user id
  # takes precedence and makes the name and domain irrelevant.
  OS_USERNAME: ""
  OS_USER_ID: ""
  OS_USER_DOMAIN_ID: default
  OS_PROJECT_ID: ""
  OS_REGION_NAME: ""
  OS_INTERFACE: public

  SSE_HEARTBEAT_SECONDS: "15"
  SSE_QUEUE_MAXSIZE: "100"

  # Auth. JWT_SECRET and ADMIN_PASSWORD are the secret half and live in
  # api-secrets.yaml; a username is not a secret, and having it here means
  # `kubectl get cm app-config` answers "who is the admin?".
  ADMIN_USERNAME: admin
  # One-shot recovery for a lost admin password: set to "true", restart, then
  # set it back. Left on, it rewrites the password from the Secret on every
  # boot, reverting anything set through the API.
  ADMIN_PASSWORD_RESET: "false"
  JWT_ALGORITHM: HS256
  JWT_ISSUER: snmp-metrics-api
  # Short: an access token carries its own scopes and is verified without a
  # database round trip, so it cannot be revoked — only outlived.
  ACCESS_TOKEN_TTL_SECONDS: "900"
  REFRESH_TOKEN_TTL_SECONDS: "1209600"
  PASSWORD_MIN_LENGTH: "12"
  # EventSource cannot send an Authorization header, so browsers exchange a
  # token for a single-use ticket. Short enough that one captured in Traefik's
  # access log is already spent.
  STREAM_TICKET_TTL_SECONDS: "30"

  # Failed logins are counted per username and per client address; either limit
  # reached answers 429 with Retry-After for the rest of the window. Checked
  # before the password is verified, so a throttled attempt costs no Argon2.
  # Counters are per process — at replicas > 1 the real limit is these times the
  # replica count, which is a weaker bound, not a broken one.
  LOGIN_RATE_LIMIT_ENABLED: "true"
  LOGIN_RATE_LIMIT_WINDOW_SECONDS: "300"
  LOGIN_RATE_LIMIT_MAX_PER_USER: "5"
  LOGIN_RATE_LIMIT_MAX_PER_IP: "20"

  # Read by uvicorn, not by Settings. Requests arrive from Traefik, so without
  # this every caller shares Traefik's pod address and the per-address limit
  # above becomes one bucket for the whole cluster. Uvicorn only believes
  # X-Forwarded-For from an address listed here; "*" trusts whatever reaches
  # port 8000, which in this cluster is Traefik — the Service is the only route
  # in from outside. Narrow it to the Traefik pod's CIDR if anything else in the
  # cluster is ever allowed to call the API directly.
  FORWARDED_ALLOW_IPS: "*"
