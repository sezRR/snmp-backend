apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  labels:
    app: fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: fastapi
          image: fastapi-demo:0.6.2
          # The image is built by the local Docker daemon, which OrbStack's
          # Kubernetes shares. Nothing is ever pulled from a registry.
          imagePullPolicy: IfNotPresent
          envFrom:
            # Non-secret settings, then credentials. PGHOST points at the
            # cluster-internal Service, so app→database traffic never goes near
            # Traefik or the IngressRouteTCP.
            - configMapRef:
                name: app-config
            - secretRef:
                name: timescaledb
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            # The app applies its schema during startup and retries while
            # Postgres is still initialising, so it can be slow to serve the
            # first request. Liveness and readiness are suppressed until this
            # passes, which stops a slow database from causing a restart loop.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            # /readyz queries Postgres, so the pod leaves the Service endpoints
            # whenever the database is unreachable. /healthz stays dependency-free
            # below, so a database outage never gets the container restarted.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # Sized for the collector rather than for request traffic: a tick
            # every 5 seconds sampling up to 32 machines at once, each sample
            # parsed out of SNMP varbinds and serialised to jsonb, is the steady
            # load here. Memory holds the per-machine counter baselines and one
            # SSE queue per subscriber.
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
