apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fastapi
  labels:
    app: fastapi
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: PathPrefix(`/api`)
      services:
        - name: fastapi
          port: http
      middlewares:
        # Typed reference, resolved in this namespace — unlike the Ingress
        # annotation form, a wrong name here is rejected rather than ignored.
        - name: fastapi-stripprefix
