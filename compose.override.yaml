# Development overlay. Compose loads it automatically, so `docker compose up`
# is the dev environment and `docker compose -f compose.yaml up` is not.
#
# What it changes: source is mounted over the copy in the image and uvicorn
# reloads on save, the database is reachable from the host, SNMP and OpenStack
# are simulated, and nothing restarts behind your back.

services:
  timescaledb:
    ports:
      # Loopback only, deliberately. OrbStack and Docker Desktop publish on
      # every interface, and this is a committed demo password. 15432 rather
      # than 5432 so it never collides with the cluster's IngressRouteTCP,
      # which already has the Mac's 5432.
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    restart: "no"

  api:
    volumes:
      # Read-only: the app never writes to its own source, and this keeps the
      # container from touching your working tree.
      - ./src:/app/src:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      # Only the mounted tree, not the site-packages under /app/.venv.
      - --reload-dir
      - /app/src
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      # A container on a laptop has no route to the SNMP agents, and the
      # simulator produces the same payload shape. Set SNMP_SIMULATE=false in
      # `.env` to poll real agents — the container needs its own route to them,
      # which a Tailscale address on the host does not automatically give it.
      SNMP_SIMULATE: ${SNMP_SIMULATE:-true}
      OPENSTACK_SIMULATE: ${OPENSTACK_SIMULATE:-true}
      # File events cross the macOS/Linux boundary on OrbStack and recent
      # Docker Desktop. If a save does not trigger a reload, set this to true.
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-false}
      # Dev defaults for the two values compose.yaml refuses to invent, so
      # `make up` works on a clean checkout. Both are committed demo credentials
      # and neither is a secret; override them in `.env`. Note that changing
      # JWT_SECRET invalidates every token already issued.
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-secret-0123456789abcdef0123456789abcdef}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-admin-password}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-false}
      # `Settings` only demands a credential key when SNMP_SIMULATE=false, but
      # the dev stack wants one regardless: without it the backend cannot seed
      # the `default-v2c` profile, and a machine with no credential bound is not
      # polled at all — the stack would come up healthy and collect nothing.
      # A committed dev key, like the two above. Never use it anywhere real.
      SNMP_CREDENTIAL_KEYS: ${SNMP_CREDENTIAL_KEYS:-{"dev":"00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"}}
      SNMP_CREDENTIAL_ACTIVE_KEY: ${SNMP_CREDENTIAL_ACTIVE_KEY:-dev}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      SNMP_PORT: ${SNMP_PORT:-161}
    # The reloader needs to fork and write nothing, but a read-only root is an
    # unhelpful surprise while debugging.
    read_only: false
    restart: "no"
    develop:
      watch:
        # Source needs no sync rule — it is bind-mounted above and uvicorn
        # reloads itself. Dependencies do: they live in the image.
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  # A real SNMP agent to point real credentials at.
  #
  # The simulator cannot exercise SNMPv3: engine discovery, key localization and
  # the time-window checks all live in the protocol, and getting any of them
  # wrong fails in ways a simulator will happily report as success. This is one
  # container with one authPriv user, so `make up` yields something an
  # authPriv credential can actually be tested against.
  #
  # Started under a profile, because the default dev stack simulates SNMP and
  # has no use for it: `docker compose --profile snmp up -d snmpd`.
  snmpd:
    profiles:
      - snmp
    # Alpine plus net-snmp from its repository rather than a prebuilt SNMP
    # image: the popular ones are amd64-only and pin net-snmp 5.7, which
    # predates SHA-2 and AES-192/256 in `createUser` — so the one thing this
    # container exists to test could not be configured on it.
    image: docker.io/library/alpine:3.20
    command:
      - /bin/sh
      - -c
      - |
        set -e
        # -tools as well, so `docker compose exec snmpd snmpget ...` can be used
        # to tell "the agent is wrong" apart from "our sampler is wrong".
        apk add --no-cache net-snmp net-snmp-tools >/dev/null
        mkdir -p /var/lib/net-snmp
        # createUser is consumed on first start: snmpd hashes the passphrases
        # into /var/lib/net-snmp/snmpd.conf and the line is meant to be removed
        # afterwards. It lives in the persistent file here, which is empty on
        # every container start, so it is written fresh each time.
        cat > /var/lib/net-snmp/snmpd.conf <<'EOF'
        createUser fleetmon SHA-256 "dev-auth-passphrase" AES-128 "dev-priv-passphrase"
        EOF
        # The view matters as much as the user. The stock view contains none of
        # the subtrees the sampler walks, and an agent left that way answers
        # every walk with nothing at all rather than with a permission error —
        # which arrives here as "no HOST-RESOURCES-MIB rows".
        cat > /etc/snmp/snmpd.conf <<'EOF'
        rouser fleetmon authPriv -V fleet
        rocommunity public default -V fleet
        view fleet included .1.3.6.1.2.1.1
        view fleet included .1.3.6.1.2.1.2
        view fleet included .1.3.6.1.2.1.25
        view fleet included .1.3.6.1.2.1.31
        view fleet included .1.3.6.1.4.1.2021.13.15
        EOF
        # The listen address goes on the command line, not in `agentaddress`:
        # with the config-file form this build fails with "Error opening
        # specified endpoint" and exits.
        exec snmpd -f -Lo -c /etc/snmp/snmpd.conf udp:0.0.0.0:161
    restart: "no"

  # A second agent with the *same* securityName and a different passphrase.
  #
  # This is not padding. pysnmp caches USM users on an engine under
  # (userName, securityEngineId), so before credentials got an engine each,
  # these two profiles shared a cache entry and every tick tore one down to
  # install the other while samples were in flight. One agent cannot reproduce
  # that; two with a colliding user name is the smallest thing that can.
  # Bind a credential per agent and watch both stay green.
  snmpd2:
    profiles:
      - snmp
    image: docker.io/library/alpine:3.20
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache net-snmp net-snmp-tools >/dev/null
        mkdir -p /var/lib/net-snmp
        cat > /var/lib/net-snmp/snmpd.conf <<'EOF'
        createUser fleetmon SHA-256 "second-auth-passphrase" AES-128 "second-priv-passphrase"
        EOF
        cat > /etc/snmp/snmpd.conf <<'EOF'
        rouser fleetmon authPriv -V fleet
        view fleet included .1.3.6.1.2.1.1
        view fleet included .1.3.6.1.2.1.2
        view fleet included .1.3.6.1.2.1.25
        view fleet included .1.3.6.1.2.1.31
        EOF
        exec snmpd -f -Lo -c /etc/snmp/snmpd.conf udp:0.0.0.0:161
    restart: "no"

  # One-shot: register the simulated fleet so a fresh stack has machines to
  # poll. `docker compose --profile seed run --rm seed` (or `make seed`).
  seed:
    profiles:
      - seed
    build:
      context: .
    # Same image as the api service; only the entrypoint differs.
    image: fastapi-demo:${APP_VERSION:-dev}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts:ro
    environment:
      API_BASE: http://api:8000
      # /machines is behind machines:write now, so the seeder logs in first.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-admin-password}
    entrypoint:
      - python
      - /app/scripts/seed_dev.py
    restart: "no"
