# Local development stack. Copy `.env.example` to `.env` before starting it;
# Compose uses that file both for YAML interpolation and as the API container's
# environment. Container-only topology stays here so the same `.env` can also
# be used by host tools, where Postgres is reached through localhost.

name: snmp-metrics

services:
  timescaledb:
    image: timescale/timescaledb:2.22.1-pg17
    environment:
      POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
      POSTGRES_USER: ${PGUSER:?Set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      # A subdirectory, so initdb never sees the volume's lost+found.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${PGPORT:-15432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    # Alembic owns the schema and applies it from the API startup path. Init
    # scripts would only run against an empty volume and could not evolve it.
    healthcheck:
      # TCP only becomes ready after initdb's temporary socket-only server exits.
      test:
        ["CMD-SHELL", 'pg_isready -h localhost -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G

  api:
    build:
      context: .
    image: fastapi-demo:${APP_VERSION:-dev}
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # These values describe the Compose network, not application preference.
      PGHOST: timescaledb
      PGPORT: "5432"
      # Keep shell overrides aligned with the values used to initialize Postgres.
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
      PGUSER: ${PGUSER:?Set PGUSER in .env}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    healthcheck:
      # /readyz queries Postgres, so `up --wait` only succeeds when requests can
      # be served. Docker reports an unhealthy container but does not restart it.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    develop:
      watch:
        # Source is bind-mounted; dependencies still require an image rebuild.
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  # Real SNMP agents for exercising v2c and v3 behavior locally. They are
  # profile-gated because the default stack uses the simulator.
  snmpd:
    profiles:
      - snmp
    image: docker.io/library/alpine:3.20
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache net-snmp net-snmp-tools >/dev/null
        mkdir -p /var/lib/net-snmp
        cat > /var/lib/net-snmp/snmpd.conf <<'EOF'
        createUser fleetmon SHA-256 "dev-auth-passphrase" AES-128 "dev-priv-passphrase"
        EOF
        cat > /etc/snmp/snmpd.conf <<'EOF'
        rouser fleetmon authPriv -V fleet
        rocommunity public default -V fleet
        view fleet included .1.3.6.1.2.1.1
        view fleet included .1.3.6.1.2.1.2
        view fleet included .1.3.6.1.2.1.25
        view fleet included .1.3.6.1.2.1.31
        view fleet included .1.3.6.1.4.1.2021.13.15
        EOF
        exec snmpd -f -Lo -c /etc/snmp/snmpd.conf udp:0.0.0.0:161
    restart: "no"

  # Same securityName as snmpd with a different passphrase, which exercises the
  # per-engine pysnmp credential cache behavior.
  snmpd2:
    profiles:
      - snmp
    image: docker.io/library/alpine:3.20
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache net-snmp net-snmp-tools >/dev/null
        mkdir -p /var/lib/net-snmp
        cat > /var/lib/net-snmp/snmpd.conf <<'EOF'
        createUser fleetmon SHA-256 "second-auth-passphrase" AES-128 "second-priv-passphrase"
        EOF
        cat > /etc/snmp/snmpd.conf <<'EOF'
        rouser fleetmon authPriv -V fleet
        view fleet included .1.3.6.1.2.1.1
        view fleet included .1.3.6.1.2.1.2
        view fleet included .1.3.6.1.2.1.25
        view fleet included .1.3.6.1.2.1.31
        EOF
        exec snmpd -f -Lo -c /etc/snmp/snmpd.conf udp:0.0.0.0:161
    restart: "no"

volumes:
  # `docker compose down` keeps data; `down -v` removes it.
  timescale-data:

networks:
 default:
   driver: bridge
   driver_opts:
     com.docker.network.bridge.name: br-72ec59b7c8bb
   ipam:
     config:
       - subnet: 172.19.0.0/16
