[project]
name = "k8s-local-image-deployment"
version = "0.1.0"
description = "Deploy a locally-built Docker image to Kubernetes with no container registry"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.140.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.14.2",
    "pysnmp>=7.1.27",
    "sse-starlette>=3.4.6",
    "starlette>=1.3.1",
]
