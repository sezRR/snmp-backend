# Alembic configuration for the host CLI: `make revision`, `make history`,
# `uv run alembic ...`.
#
# The running application never reads this file. `app.db.migrate` builds an
# equivalent Config in code, which is why the Docker image — whose runtime stage
# copies only src/ — needs nothing from the repository root.
#
# `sqlalchemy.url` is deliberately empty. env.py fills it from Settings, so the
# database credentials live in exactly one place and are never committed here.

[alembic]
script_location = src/app/db/migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

# Revisions are numbered rather than hash-named, so `ls versions/` reads in
# order and a reviewer can see at a glance which migration is which.
file_template = %%(rev)s_%%(slug)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
